[project]
name = "ai-model-manager"
version = "0.1.0"
description = "Self-improving model routing, tracking and learning for Claude Code"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
model-manager = "modelmgr.cli:main"
usage-optimizer = "modelmgr.cli:main_uo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelmgr"]
