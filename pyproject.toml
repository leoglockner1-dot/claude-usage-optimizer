[project]
name = "claude-usage-optimizer"
version = "0.1.0"
description = "Usage Optimizer for Claude Code: find where usage goes and how to cut it. Includes Model Manager."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
model-manager = "modelmgr.cli:main"
usage-optimizer = "modelmgr.cli:main_uo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelmgr"]
